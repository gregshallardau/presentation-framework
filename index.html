<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Presentation Framework</title>
		<!-- No stylesheet links: all CSS is imported through /src/main.js so it is cascade-layered.
		     This lone @layer statement pins the layer order BEFORE the bundled CSS loads, so a
		     minifier that drops the statement from src/styles/layers.css can't change precedence.
		     `deck` is last = highest: the root-level deck.css wins over everything. -->
		<style>@layer reveal.reset, reveal.base, reveal.theme, vars.primitive, vars.semantic, theme, components, deck;</style>
		<!-- Until Reveal has laid the deck out (it adds .ready to .reveal), keep the raw slide
		     markup from painting: in dev the CSS arrives through JS, a moment after the HTML. -->
		<style>.reveal:not(.ready) { visibility: hidden; }</style>
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<!-- @slides -->
			</div>
		</div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
